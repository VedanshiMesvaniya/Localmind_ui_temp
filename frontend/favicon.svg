      <stop offset="0%" stop-color="#4CB89F"/>
      <stop offset="100%" stop-color="#0F6B62"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="32" height="32" rx="7.5" fill="#F2F5F3"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#D6DFDD" stroke-width="1"/>

